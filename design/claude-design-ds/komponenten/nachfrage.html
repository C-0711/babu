<!-- @dsCard group="Komponenten" -->
<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8"><title>Nachfrage · menschlich statt Paragraf</title>
<style>:root{--gc-bg:#ffffff;--gc-canvas:#faf9f5;--gc-desk:#efece6;--gc-chrome:#f4f1ec;--gc-fg:#111111;--gc-body:#333333;--gc-desc:#555555;--gc-muted:#999999;--gc-accent:#857b61;--gc-accent-hover:#736950;--gc-accent-subtle:#f0ebe3;--gc-ok:#6f8a6e;--gc-warn:#b0821f;--gc-danger:#a8433a;--gc-scan:#1f1e1a;--gc-gold:#c9b98d}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,'Segoe UI',Roboto,'Helvetica Neue',sans-serif;background:var(--gc-desk);padding:24px;color:var(--gc-body)}
.serif{font-family:Georgia,'Times New Roman',serif}
.mono{font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace}
.karte{background:var(--gc-bg);border-radius:14px;padding:16px;box-shadow:0 3px 8px rgba(31,30,26,.08)}
.label{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--gc-muted);font-family:ui-monospace,'SF Mono',Menlo,monospace;margin:14px 0 8px}
.feld{background:var(--gc-canvas);border:1px solid #e4e0d8;border-radius:12px;padding:11px 13px;font-size:13px;color:var(--gc-muted);margin-top:8px}
.knopf{margin-top:12px;background:var(--gc-accent);color:#fff;border-radius:999px;padding:12px;text-align:center;font-size:14px;font-weight:600}
</style></head><body>
<div class="karte" style="max-width:340px">
<div class="serif" style="font-size:19px;font-weight:600;color:var(--gc-fg)">Mit wem warst du essen?</div>
<div style="font-size:12px;color:var(--gc-desc);margin-top:4px">Kurz notiert, und der Beleg zählt voll — das Finanzamt will Anlass und Namen wissen.</div>
<div class="feld">Anlass — z.&nbsp;B. Team-Essen nach der Schulung</div>
<div class="feld">Wer war dabei? (auch du)</div>
<div class="knopf">Fertig — buchen</div>
<div class="mono" style="font-size:9px;color:var(--gc-muted);margin-top:10px;text-align:center">§4 Abs. 5 Nr. 2 EStG · Unterschrift gehört aufs Papier</div>
</div>
</body></html>
