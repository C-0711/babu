<!-- @dsCard group="Komponenten" -->
<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8"><title>Badges & Confidence</title>
<style>:root{--gc-bg:#ffffff;--gc-canvas:#faf9f5;--gc-desk:#efece6;--gc-chrome:#f4f1ec;--gc-fg:#111111;--gc-body:#333333;--gc-desc:#555555;--gc-muted:#999999;--gc-accent:#857b61;--gc-accent-hover:#736950;--gc-accent-subtle:#f0ebe3;--gc-ok:#6f8a6e;--gc-warn:#b0821f;--gc-danger:#a8433a;--gc-scan:#1f1e1a;--gc-gold:#c9b98d}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,'Segoe UI',Roboto,'Helvetica Neue',sans-serif;background:var(--gc-desk);padding:24px;color:var(--gc-body)}
.serif{font-family:Georgia,'Times New Roman',serif}
.mono{font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace}
.karte{background:var(--gc-bg);border-radius:14px;padding:16px;box-shadow:0 3px 8px rgba(31,30,26,.08)}
.label{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--gc-muted);font-family:ui-monospace,'SF Mono',Menlo,monospace;margin:14px 0 8px}
.badge{display:inline-block;font-family:ui-monospace,Menlo,monospace;font-size:9px;letter-spacing:.5px;padding:2px 8px;border-radius:99px;border:1px solid}
.balken{height:6px;border-radius:3px;background:var(--gc-chrome);overflow:hidden;flex:1}
.balken i{display:block;height:100%;border-radius:3px}
.zeile{display:flex;align-items:center;gap:10px;margin:8px 0}
</style></head><body>
<div class="karte">
<div class="label">Herkunft-Badges — Provenance als UI-Element</div>
<span class="badge" style="color:#857b61;border-color:rgba(133,123,97,.5)">HISTORIE</span>
<span class="badge" style="color:#6f8a6e;border-color:rgba(111,138,110,.5)">REGEL</span>
<span class="badge" style="color:#b0821f;border-color:rgba(176,130,31,.5)">KI</span>
<span class="badge" style="color:#999;border-color:rgba(153,153,153,.5)">MANUELL</span>
<div class="label">Confidence — Farbe codiert, Zahl immer dabei (≥95 Bronze · ≥80 Grün · darunter Amber)</div>
<div class="zeile"><div class="balken"><i style="width:97%;background:var(--gc-accent)"></i></div><span class="mono" style="font-size:12px;color:var(--gc-desc)">97&nbsp;%</span></div>
<div class="zeile"><div class="balken"><i style="width:87%;background:var(--gc-ok)"></i></div><span class="mono" style="font-size:12px;color:var(--gc-desc)">87&nbsp;%</span></div>
<div class="zeile"><div class="balken"><i style="width:74%;background:var(--gc-warn)"></i></div><span class="mono" style="font-size:12px;color:var(--gc-desc)">74&nbsp;%</span></div>
<div class="label">Routing: ≥95 automatisch · 80–94 bestätigen · &lt;80 prüfen</div>
</div>
</body></html>
