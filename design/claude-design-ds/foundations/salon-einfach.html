<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8"><title>Salon-Modus · Super-einfacher Home-Screen</title>
<style>:root{--gc-bg:#ffffff;--gc-canvas:#faf9f5;--gc-desk:#efece6;--gc-chrome:#f4f1ec;--gc-fg:#111111;--gc-body:#333333;--gc-desc:#555555;--gc-muted:#999999;--gc-accent:#857b61;--gc-accent-hover:#736950;--gc-accent-subtle:#f0ebe3;--gc-ok:#6f8a6e;--gc-warn:#b0821f;--gc-danger:#a8433a;--gc-scan:#1f1e1a;--gc-gold:#c9b98d}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,'Segoe UI',Roboto,'Helvetica Neue',sans-serif;background:var(--gc-desk);padding:24px;color:var(--gc-body)}
.serif{font-family:Georgia,'Times New Roman',serif}
.mono{font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace}
.karte{background:var(--gc-bg);border-radius:14px;padding:16px;box-shadow:0 3px 8px rgba(31,30,26,.08)}
.label{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--gc-muted);font-family:ui-monospace,'SF Mono',Menlo,monospace;margin:14px 0 8px}
.tel{width:300px;margin:0 auto;background:var(--gc-canvas);border-radius:28px;padding:22px 18px;box-shadow:0 8px 24px rgba(31,30,26,.14)}
.scan{background:var(--gc-scan);border-radius:20px;padding:34px 18px;text-align:center;color:#fff}
.knopf{margin-top:14px;background:var(--gc-accent);color:#fff;border-radius:999px;padding:13px;text-align:center;font-size:15px;font-weight:600}
.mini-karte{background:var(--gc-bg);border-radius:14px;padding:11px 13px;margin-top:10px;display:flex;align-items:center;gap:10px;box-shadow:0 2px 6px rgba(31,30,26,.06)}
.emoji{width:34px;height:34px;border-radius:10px;background:var(--gc-accent-subtle);display:flex;align-items:center;justify-content:center;font-size:16px}
</style></head><body>
<div class="tel">
<div class="serif" style="font-size:22px;font-weight:600;color:var(--gc-fg);margin-bottom:12px">Guten Morgen ✨</div>
<div class="scan">
<div style="font-size:34px">⌞&nbsp;&nbsp;⌝</div>
<div class="serif" style="font-size:17px;margin-top:8px">Beleg einfach hinhalten</div>
<div style="font-size:11px;opacity:.6;margin-top:4px">löst von selbst aus · wird sicher archiviert</div>
</div>
<div class="knopf">Scannen</div>
<div class="label" style="margin-top:16px">Zuletzt</div>
<div class="mini-karte"><div class="emoji">💇‍♀️</div><div style="flex:1"><div style="font-size:13px;font-weight:600;color:var(--gc-fg)">Slavic Hair Company</div><div style="font-size:11px;color:var(--gc-muted)">Wareneinkauf · erledigt ✓</div></div><div class="mono" style="font-size:13px">312,40&nbsp;€</div></div>
<div class="mini-karte"><div class="emoji">🍽️</div><div style="flex:1"><div style="font-size:13px;font-weight:600;color:var(--gc-fg)">Weingärtle</div><div style="font-size:11px;color:var(--gc-warn)">Mit wem warst du essen?</div></div><div class="mono" style="font-size:13px">142,60&nbsp;€</div></div>
</div>
</body></html>
