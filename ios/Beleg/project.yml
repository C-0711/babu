# Fallback für ältere Xcode-Versionen (< 16): Projekt mit XcodeGen erzeugen.
#   brew install xcodegen && cd ios/Beleg && xcodegen generate
name: Beleg
options:
  bundleIdPrefix: io.0711
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: de

# Zwei Ziele aus EINEM Ordner: „Beleg" ist die schmale App (der Scanner, das
# Hirn, der Profilbauer, das DATEV-Büchlein), „BelegPro" kann dazu den ganzen
# Betrieb. Der Unterschied ist eine einzige Einstellung — BABU_PRO — und was
# sie bewirkt, steht in Beleg/Ausbaustufe.swift. Keine Datei wird ausgelassen.
targetTemplates:
  App:
    type: application
    platform: iOS
    sources: [Beleg]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Support/Info.plist
        INFOPLIST_KEY_NSCameraUsageDescription: "Die Kamera erfasst deine Belege."
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # Version und Build stehen HIER und in project.pbxproj (vier
        # Konfigurationen) — ios/Tests/run.sh prüft, dass beide gleich sind.
        # Jeder TestFlight-Upload braucht eine neue Build-Nummer; 1 ist
        # verbraucht (Ad-hoc-Verteilung bis 14.09.2026).
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 2
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        # Das Team von 0711 Intelligence — ohne das kein Archiv, kein Upload.
        DEVELOPMENT_TEAM: 8L87Z2GRSG

targets:
  Beleg:
    templates: [App]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.0711.beleg
        # Der Name auf dem Homescreen. Steht nicht in der Info.plist, weil
        # sich beide Apps dieselbe Datei teilen.
        BABU_ANZEIGENAME: babu
  BelegPro:
    templates: [App]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.0711.beleg.pro
        BABU_ANZEIGENAME: babu Pro
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) BABU_PRO"
