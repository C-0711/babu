# Fallback für ältere Xcode-Versionen (< 16): Projekt mit XcodeGen erzeugen.
#   brew install xcodegen && cd ios/Beleg && xcodegen generate
name: Beleg
options:
  bundleIdPrefix: io.0711
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: de
targets:
  Beleg:
    type: application
    platform: iOS
    sources: [Beleg]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Support/Info.plist
        INFOPLIST_KEY_NSCameraUsageDescription: "Die Kamera erfasst deine Belege."
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        PRODUCT_BUNDLE_IDENTIFIER: io.0711.beleg
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
