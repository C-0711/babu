# babu-web als Container auf der H200V.
#
# network_mode: host — bewusst: babu-web bindet wie bisher 127.0.0.1:7844
# (der Cloudflare-Tunnel zeigt dorthin) und erreicht seine Host-Dienste
# unverändert: Belegbox-Gateway :7808 (insp-app) und vLLM/Gemma :11435.
# Die Isolation liegt im Dateisystem: der Container sieht NUR die vier
# gemounteten Pfade, nichts sonst vom Home.
#
# Betrieb: docker compose build && docker compose up -d
# Rückweg: docker compose down && pm2 start babu-web
services:
  # Postgres (Plan 21, Phase 1). Steht bereit, ist aber noch NICHT scharf:
  # `BABU_DB_URL` unten ist auskommentiert, babu-web spricht bis dahin
  # weiter mit `portal.db`. Der Umschalter ist ein eigener, bewusster
  # Handgriff — siehe die Reihenfolge in server/belegreview/README.md.
  postgres:
    image: postgres:16
    container_name: babu-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: babu
      POSTGRES_USER: babu
      # Kein Passwort im Klartext, auch nicht als Umgebungsvariable (die
      # stünde in `docker inspect`): Docker hängt die Datei als Secret ein,
      # das Image liest sie selbst.
      POSTGRES_PASSWORD_FILE: /run/secrets/babu_pg_passwort
      # Sortierung wie SQLite (binär). Wirkt nur bei der Erstanlage des
      # Datenverzeichnisses — später ließe es sich nur mit einem Neuaufbau
      # ändern. `ORDER BY name` soll dieselbe Reihenfolge liefern wie bisher.
      POSTGRES_INITDB_ARGS: "--locale=C --encoding=UTF8"
    secrets:
      - babu_pg_passwort
    volumes:
      - babu-pg-daten:/var/lib/postgresql/data
    ports:
      # NUR localhost. babu-web läuft im Host-Netz und erreicht Postgres
      # damit über 127.0.0.1:55432 — genau wie insp-app und vLLM. Von außen
      # ist der Port nicht zu sehen; 5432 auf dem Host bleibt frei.
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U babu -d babu"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging:
      driver: json-file
      options: {max-size: "20m", max-file: "3"}

  babu-web:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: babu-web
    container_name: babu-web
    network_mode: host
    # christoph.bertsch auf der H200V — Dateien in den Volumes behalten
    # ihren Besitzer, Backups und Handgriffe auf dem Host funktionieren weiter.
    user: "1001:1000"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      HOME: /data
      BABU_ERLAUBT: "christoph0711.io,nina0711.io"
      BABU_ROLLEN: "christoph0711.io:admin"
      # Pilot ab 14.09.2026: kein Selbstbedienungs-Konto. Betriebe kommen auf
      # Einladung, Konten legt die Kanzlei im Portal an. `POST /api/signup`
      # antwortet 404, die Anmeldeseite zeigt „Konto anlegen" nicht.
      BABU_SIGNUP: "0"
      # Mailversand (Passwort vergessen, Kanzlei-Einladung, Support-Kopie).
      # Die Zugangsdaten stehen in der `.env` neben dieser Datei (0600, nie im
      # Repo); ein Mail-Dienst mit SMTP-Relay (Postmark, Brevo, Mailgun).
      # Leer heißt: keine Mail geht raus, jede landet als Datei im
      # Postausgang unter ~/babu-web/postausgang — und die Kanzlei sieht den
      # Einladungslink weiter in ihrer Antwort.
      BABU_SMTP_HOST: "${BABU_SMTP_HOST:-}"
      BABU_SMTP_PORT: "${BABU_SMTP_PORT:-587}"
      BABU_SMTP_NUTZER: "${BABU_SMTP_NUTZER:-}"
      BABU_SMTP_PASSWORT: "${BABU_SMTP_PASSWORT:-}"
      BABU_ABSENDER: "${BABU_ABSENDER:-babu <post@babu.0711.io>}"
      # Das Support-Postfach bekommt eine Kopie jeder Rückmeldung; leer = keine.
      BABU_SUPPORT_MAIL: "${BABU_SUPPORT_MAIL:-}"
      # --- Postgres scharf schalten (Plan 21, Phase 1) -------------------
      # Erst hochfahren, dann EINMAL von Hand umziehen
      #   docker compose up -d postgres
      #   BABU_DB_URL=… python3 werkzeug/migrate_sqlite_to_pg.py
      # und erst danach die nächste Zeile einkommentieren und
      # `docker compose up -d` fahren. Ohne sie bleibt `portal.db` die
      # Wahrheit — das ist auch der Rückweg: Zeile wieder auskommentieren.
      BABU_DB_URL: "postgresql://babu@127.0.0.1:55432/babu"
      # Das Passwort steht nicht in der URL, sondern in der Secret-Datei;
      # `db.verbindung()` liest sie und reicht es psycopg getrennt herein.
      BABU_DB_PASSWORT_DATEI: /run/secrets/babu_pg_passwort
      # Posteingang: dasselbe gemeinsame Geheimnis wie im Mailserver. Nur
      # damit antwortet `/api/posteingang/aufloesen` überhaupt — ohne es ist
      # die Route tot, und das ist der richtige Ruhezustand, solange kein
      # Mailserver läuft.
      BABU_POSTEINGANG_TOKEN: "${BABU_POSTEINGANG_TOKEN:-}"
      BABU_POST_DOMAENE: "post.babu.0711.io"
      # Gürtel und Hosenträger: falls ein gemountetes Repo einem anderen
      # Besitzer gehört, soll git lesen statt verweigern.
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: "safe.directory"
      GIT_CONFIG_VALUE_0: "*"
    secrets:
      - babu_pg_passwort
    volumes:
      - ~/babu-web:/data/babu-web                                   # portal.db, Box-Klon, Session-Geheimnis, Logos, index.html
      - ~/inspektor-store:/data/inspektor-store:ro                  # Bare-Store, nur lesen (Schreiben geht über :7808)
      - ~/gitchain-eingang/.pat_babu:/data/gitchain-eingang/.pat_babu:ro
      - ~/Youtube/.env:/data/Youtube/.env:ro                        # Gemini-Schlüssel für die Bild-Generierung
      - ~/kompendium:/data/kompendium:ro                            # Branchen-Kompendium: Vektoren + Atome + Grundwissen
    restart: unless-stopped
    # Lebenszeichen (seit 14.09.2026): `GET /healthz` prüft Datenbank, Box-Klon
    # und Gemma. Direkt auf 127.0.0.1:7844, am Tunnel vorbei; kein curl im
    # Image, deshalb Python. `start_period` 90 s: Kompendium und erster Index
    # brauchen nach dem Start Zeit. `restart: unless-stopped` greift nur bei
    # Prozessende — bei `unhealthy` startet `docker/wache.sh` (Host-Cron) neu.
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://127.0.0.1:7844/healthz', timeout=8)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    # Ohne Grenze wächst das json-file-Log, bis die Platte voll ist — und eine
    # volle Platte ist ein Ausfall. Zeitstempel liefert `docker logs -t`.
    logging:
      driver: json-file
      options: {max-size: "50m", max-file: "5"}

  # Der Posteingang: ein eigener Mailserver, der Post an die Zufallsadressen
  # aus `post_adresse` annimmt und über die HTTP-API von babu-web ablegt.
  # Quelle und Betriebsanleitung: server/posteingang/README.md.
  #
  # `profiles` — der Dienst startet NICHT bei `docker compose up -d`. Das ist
  # Absicht: er ist gebaut und lokal geprüft, aber die Portfreigabe im Netz
  # (MX, Weiterleitung 25, Reverse-DNS) ist noch nicht gemacht, und ein
  # SMTP-Empfänger ohne MX nimmt nichts an und fällt nur auf. Scharf
  # schalten mit `docker compose --profile posteingang up -d posteingang`.
  posteingang:
    profiles: ["posteingang"]
    build:
      context: ../posteingang
      dockerfile: Dockerfile
    image: babu-posteingang
    container_name: babu-posteingang
    # host wie babu-web — der Dienst muss babu-web auf 127.0.0.1:7844
    # erreichen, und das bindet nur auf localhost. Er hört selbst auf 2525;
    # die Weiterleitung 25 -> 2525 macht der Host (README.md), damit hier
    # kein Prozess mit Portrechten fremde Mail entgegennimmt.
    network_mode: host
    depends_on:
      - babu-web
    environment:
      BABU_URL: "http://127.0.0.1:7844"
      BABU_POST_DOMAENE: "post.babu.0711.io"
      POSTEINGANG_HOST: "0.0.0.0"
      POSTEINGANG_PORT: "2525"
      # Beide Geheimnisse stehen NICHT hier, sondern in der `.env` neben
      # dieser Datei (0600). Anlegen: siehe README.md. Leer ist erlaubt und
      # führt NICHT dazu, dass ein halb konfigurierter Dienst startet —
      # `posteingang.main()` bricht dann mit einem Satz ab. Ein `:?` hier
      # wäre falsch: Compose löst das auch für abgeschaltete Profile auf und
      # zerlegte damit jedes gewöhnliche `docker compose up -d`.
      BABU_POSTEINGANG_PAT: "${BABU_POSTEINGANG_PAT:-}"
      BABU_POSTEINGANG_TOKEN: "${BABU_POSTEINGANG_TOKEN:-}"
      # Grenzen; die Vorgaben im Code sind dieselben Zahlen und gelten,
      # wenn hier nichts steht.
      POSTEINGANG_SENDUNG_MAX: "26214400"
      POSTEINGANG_ANHANG_MAX: "15728640"
      POSTEINGANG_RATE_IP: "60"
      POSTEINGANG_RATE_ADRESSE: "120"
    restart: unless-stopped

# Die Datei liegt auf dem Host mit 0600 und gehört christoph.bertsch. Als
# Secret liest sie der Docker-Daemon (root) und legt sie in beiden
# Containern unter /run/secrets/ ab — auch für den postgres-Benutzer im
# Postgres-Image lesbar, der ein direkt gemountetes 0600-Bind nicht öffnen
# könnte. Anlegen (einmalig, auf der H200V):
#   umask 077 && openssl rand -base64 33 | tr -d '\n' > ~/babu-web/.pg_passwort
secrets:
  babu_pg_passwort:
    file: ${HOME}/babu-web/.pg_passwort

volumes:
  babu-pg-daten:
