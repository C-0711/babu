<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>babu — Workbench</title>
<style>
/* Kanzlei-Sicht: Dichte vor Deko, Fachvokabular erlaubt.
   Shell & Tokens aus design/unlimited-ocr/ — System-Fonts, kein CDN. */
:root{
  --gc-bg:#fff; --gc-canvas:#faf9f5; --gc-desk:#efece6; --gc-chrome:#f4f1ec;
  --gc-fg:#111; --gc-body:#333; --gc-desc:#555; --gc-muted:#999;
  --gc-accent:#857b61; --gc-accent-subtle:#f0ebe3; --gc-border:#e5e7eb;
  --gc-ok:#6f8a6e; --gc-warn:#b0821f; --gc-danger:#a8433a;
  --gc-serif:Georgia,serif; --gc-sans:Inter,-apple-system,'Segoe UI',sans-serif;
  --gc-mono:'SF Mono',ui-monospace,Menlo,monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font:13.5px/1.5 var(--gc-sans);color:var(--gc-body);background:var(--gc-canvas);height:100dvh;display:flex;flex-direction:column}
.num{font-family:var(--gc-mono);font-variant-numeric:tabular-nums}
.lbl{font:600 9.5px var(--gc-sans);letter-spacing:.11em;text-transform:uppercase;color:var(--gc-muted)}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
:focus-visible{outline:2px solid var(--gc-accent)}
header{background:var(--gc-chrome);border-bottom:1px solid var(--gc-border);
  padding:9px 16px;display:flex;align-items:center;gap:14px}
header h1{font:600 16px var(--gc-serif);color:var(--gc-fg)}
header .mon{display:flex;align-items:center;gap:8px}
header .mon button{width:24px;height:24px;border:1px solid var(--gc-border);border-radius:6px;background:var(--gc-bg)}
header .mon b{min-width:96px;text-align:center;font-size:12.5px}
#kopf-recht{margin-left:auto;display:flex;gap:8px;align-items:center;font-size:12px;color:var(--gc-desc)}
.knopf{padding:6px 12px;border-radius:8px;border:1px solid var(--gc-border);background:var(--gc-bg);font-size:12.5px;font-weight:550}
.knopf.primaer{background:var(--gc-fg);color:#fff;border-color:var(--gc-fg)}
main{flex:1;display:grid;grid-template-columns:300px minmax(0,1fr) 380px;min-height:0}
@media(max-width:980px){main{grid-template-columns:260px minmax(0,1fr)}#form{display:none}}

#queue{border-right:1px solid var(--gc-border);overflow-y:auto;background:var(--gc-bg)}
#queue .kopfz{padding:10px 14px;border-bottom:1px solid var(--gc-border);position:sticky;top:0;background:var(--gc-bg)}
.qrow{display:flex;gap:10px;width:100%;text-align:left;padding:10px 14px;border-bottom:1px solid var(--gc-border);align-items:center}
.qrow.an{background:var(--gc-accent-subtle)}
.qrow .wer{font-weight:600;color:var(--gc-fg);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qrow .was{font-size:11px;color:var(--gc-muted)}
.qrow .betrag{margin-left:auto;font:600 12.5px var(--gc-mono);color:var(--gc-fg)}
.badge{font:600 9px var(--gc-sans);letter-spacing:.06em;text-transform:uppercase;
  padding:2px 6px;border-radius:4px;flex:none}
.badge.offen{background:#f7ecd4;color:var(--gc-warn)}
.badge.ok{background:#e7ede7;color:var(--gc-ok)}
.badge.exp{background:var(--gc-accent-subtle);color:var(--gc-accent)}
.badge.korr{background:#f3e3e1;color:var(--gc-danger)}

#stage{background:var(--gc-desk);display:flex;align-items:flex-start;justify-content:center;
  overflow:auto;padding:22px}
#stage img{max-width:100%;border-radius:4px;box-shadow:0 6px 26px rgba(0,0,0,.2)}
#stage .leer{color:var(--gc-muted);align-self:center}

#form{border-left:1px solid var(--gc-border);overflow-y:auto;padding:16px;background:var(--gc-bg)}
#form .sekt{margin-bottom:16px}
#form .lbl{display:block;margin-bottom:6px}
.feld{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid #f2f2f2;font-size:12.5px}
.feld b{font-family:var(--gc-mono);color:var(--gc-fg)}
#form input,#form select{width:100%;padding:8px 10px;border:1px solid var(--gc-border);border-radius:7px;font:inherit;background:var(--gc-bg)}
.reihe{display:flex;gap:8px}
.buchsatz{background:var(--gc-canvas);border:1px solid var(--gc-border);border-radius:8px;
  padding:10px 12px;font:12px var(--gc-mono);line-height:1.7}
footer{background:var(--gc-chrome);border-top:1px solid var(--gc-border);padding:6px 16px;
  display:flex;gap:16px;font-size:11.5px;color:var(--gc-desc)}
kbd{font:600 10px var(--gc-mono);background:var(--gc-bg);border:1px solid var(--gc-border);
  border-bottom-width:2px;border-radius:4px;padding:1px 5px}
#login{max-width:360px;margin:14dvh auto;padding:0 20px;text-align:center}
#login input{width:100%;padding:11px;border:1px solid var(--gc-border);border-radius:8px;font:13px var(--gc-mono);margin:14px 0 8px}
#login button{width:100%;background:var(--gc-fg);color:#fff;padding:11px;border-radius:8px;font-weight:600}
</style>
</head>
<body>

<div id="login" hidden>
  <div class="lbl">babu · Kanzlei</div>
  <h1 style="font:600 26px var(--gc-serif);color:var(--gc-fg);margin-top:6px">Workbench</h1>
  <input id="pat" type="password" placeholder="Zugangscode">
  <button id="anmelden">Anmelden</button>
</div>

<div id="app" hidden style="display:flex;flex-direction:column;height:100dvh">
<header>
  <h1>babu · Workbench</h1>
  <div class="mon"><button id="mzurueck">‹</button><b id="manzeige"></b><button id="mvor">›</button></div>
  <div id="kopf-recht">
    <span id="statistik"></span>
    <a class="knopf" id="export-link" href="#" download>EXTF ziehen</a>
    <button class="knopf primaer" id="festschreiben">Exportieren + festschreiben</button>
  </div>
</header>
<main>
  <div id="queue"><div class="kopfz lbl">Stapel</div><div id="qliste"></div></div>
  <div id="stage"><div class="leer">Beleg wählen (j/k)</div></div>
  <div id="form"></div>
</main>
<footer>
  <span><kbd>j</kbd>/<kbd>k</kbd> Beleg</span>
  <span><kbd>Enter</kbd> Korrektur übernehmen</span>
  <span id="fuss-summe" style="margin-left:auto"></span>
</footer>
</div>

<script>
"use strict";
const $ = s => document.querySelector(s);
const euro = n => n == null ? "—" : n.toLocaleString("de-DE",{minimumFractionDigits:2}) + " €";
let monat = (d => d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0"))(new Date());
let belege = [], akt = -1;

async function api(p, o){ const r = await fetch(p, Object.assign({credentials:"same-origin"}, o));
  if (r.status === 401){ $("#app").hidden = true; $("#login").hidden = false; throw new Error("401"); }
  return r; }

$("#anmelden").addEventListener("click", async () => {
  const r = await fetch("/api/anmelden", {method:"POST", credentials:"same-origin",
    headers:{"Content-Type":"application/json"}, body: JSON.stringify({pat: $("#pat").value.trim()})});
  if (r.ok){ $("#login").hidden = true; $("#app").hidden = false; lade(); }
});
$("#pat").addEventListener("keydown", e => { if (e.key === "Enter") $("#anmelden").click(); });

const RANG = {nachfrage: 0, erfasst: 1, "geprüft": 2, exportiert: 3};
async function lade(){
  $("#manzeige").textContent = monat;
  $("#export-link").href = `/api/export/${monat}.csv`;
  let d;
  try{ d = await (await api(`/api/belege?monat=${monat}&limit=500`)).json(); }
  catch{ return; }
  belege = d.belege.sort((a,b) => (RANG[a.status]??9) - (RANG[b.status]??9) ||
                                  (b.hochgeladen||"").localeCompare(a.hochgeladen||""));
  const offen = belege.filter(z => RANG[z.status] < 2).length;
  const summe = belege.reduce((s,z) => s + (z.brutto||0), 0);
  $("#statistik").textContent = `${belege.length} Belege · ${offen} offen`;
  $("#fuss-summe").textContent = `Stapel ${monat}: ${belege.length} Belege · Σ ${euro(summe)}`;
  $("#qliste").innerHTML = belege.map((z,i) => `
    <button class="qrow ${i===akt?"an":""}" onclick="waehle(${i})">
      <span class="badge ${z.status==="nachfrage"||z.status==="erfasst"?"offen":z.status==="exportiert"?"exp":z.korrigiert?"korr":"ok"}">
        ${z.status==="nachfrage"?"offen":z.status==="erfasst"?"liest":z.status==="exportiert"?"exp":z.korrigiert?"korr":"ok"}</span>
      <div style="min-width:0"><div class="wer">${z.lieferant || z.stamm.slice(-18)}</div>
      <div class="was">${z.belegart || z.dokumentklasse || ""} ${z.konto_skr04 ? "· " + z.konto_skr04 : ""}</div></div>
      <span class="betrag">${euro(z.brutto)}</span>
    </button>`).join("") || `<div style="padding:20px;color:var(--gc-muted)">Keine Belege im Monat.</div>`;
  if (akt < 0 && belege.length) waehle(0);
}

async function waehle(i){
  akt = i;
  document.querySelectorAll(".qrow").forEach((r,j) => r.classList.toggle("an", j === i));
  const z = belege[i];
  if (!z) return;
  $("#stage").innerHTML = /\.(jpg|jpeg|png)$/i.test(z.datei||"")
    ? `<img alt="" src="/api/beleg/${z.stamm}/bild?v=${z.bild_oid}">`
    : `<div class="leer">Datei: <a href="/api/beleg/${z.stamm}/bild">${(z.datei||"").split("/").pop()}</a></div>`;
  let d;
  try{ d = await (await api("/api/beleg/" + z.stamm)).json(); }
  catch{ return; }
  const f = d.felder || {}, e = d.einschaetzung || {}, b = d.buchungssatz;
  const tab = (f.steuertabelle || []).map(t =>
    `<div class="feld"><span>${t.satz} %</span><b>${euro(t.brutto)} (USt ${euro(t.ust)})</b></div>`).join("");
  $("#form").innerHTML = `
    <div class="sekt"><span class="lbl">Beleg</span>
      <div class="feld"><span>Lieferant</span><b style="font-family:var(--gc-sans)">${(d.vlm||{}).lieferant || f.lieferant || "—"}</b></div>
      <div class="feld"><span>Datum</span><b>${f.datum || "—"}</b></div>
      <div class="feld"><span>Brutto</span><b>${euro(f.brutto)}</b></div>
      ${tab}
      <div class="feld"><span>Beleg-Nr.</span><b>${f.beleg_nr || "—"}</b></div>
      <div class="feld"><span>Status</span><b style="font-family:var(--gc-sans)">${d.status}${z.korrigiert ? " · korrigiert" : ""}</b></div>
    </div>
    <div class="sekt"><span class="lbl">Kontierung</span>
      <div class="reihe">
        <input id="k-konto" placeholder="Konto (SKR04)" value="${z.konto_skr04 || e.konto_skr04 || ""}" class="num">
        <select id="k-bu"><option value="">BU</option>
          <option value="9" ${ (z.steuerschluessel||e.steuerschluessel)==="9"?"selected":""}>9 · VSt 19 %</option>
          <option value="8" ${ (z.steuerschluessel||e.steuerschluessel)==="8"?"selected":""}>8 · VSt 7 %</option>
          <option value="0" ${ (z.steuerschluessel||e.steuerschluessel)==="0"?"selected":""}>ohne</option></select>
      </div>
      <input id="k-text" style="margin-top:8px" placeholder="Buchungstext" maxlength="60"
        value="${(b && b.buchungstext) || ""}">
      <button class="knopf primaer" id="k-ok" style="width:100%;margin-top:10px">Korrektur übernehmen (Enter)</button>
    </div>
    ${b ? `<div class="sekt"><span class="lbl">Buchungssatz</span><div class="buchsatz">
      <b>${z.konto_skr04 || b.konto}</b> an <b>${b.gegenkonto}</b> · ${b.umsatz} S · BU ${z.steuerschluessel || b.bu_schluessel || "—"}<br>
      ${b.belegdatum || ""} ${b.belegfeld1 || ""}<br>${$("#form") ? "" : ""}${(b.buchungstext||"")}</div></div>` : ""}
    ${(e.hinweise||[]).length ? `<div class="sekt"><span class="lbl">Hinweise</span>
      ${e.hinweise.map(h => `<div class="feld"><span style="color:var(--gc-desc)">${h}</span></div>`).join("")}</div>` : ""}`;
  $("#k-ok").addEventListener("click", korrektur);
}

async function korrektur(){
  const z = belege[akt];
  if (!z) return;
  const knopf = $("#k-ok");
  knopf.textContent = "Wird übernommen …";
  try{
    const r = await api("/api/korrektur/" + z.stamm, {method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({konto_skr04: $("#k-konto").value.trim(),
                            steuerschluessel: $("#k-bu").value,
                            buchungstext: $("#k-text").value.trim()})});
    if (r.ok){ knopf.textContent = "Übernommen ✓"; setTimeout(() => { lade(); }, 600); return; }
    const d = await r.json();
    knopf.textContent = d.fehler || "Fehler — nochmal";
  }catch{ knopf.textContent = "Keine Verbindung — nochmal"; }
}

$("#festschreiben").addEventListener("click", async () => {
  const k = $("#festschreiben");
  if (!confirm(`Stapel ${monat} exportieren und festschreiben?`)) return;
  k.textContent = "Läuft …";
  try{
    const r = await api(`/api/export/${monat}.csv?festschreiben=1`);
    if (r.ok){
      const blob = await r.blob();
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = `EXTF_Buchungsstapel_${monat}.csv`;
      a.click();
      k.textContent = "Festgeschrieben ✓";
      setTimeout(lade, 800);
      return;
    }
  }catch{}
  k.textContent = "Exportieren + festschreiben";
});

$("#mzurueck").addEventListener("click", () => { monat = schiebe(monat,-1); akt = -1; lade(); });
$("#mvor").addEventListener("click", () => { monat = schiebe(monat, 1); akt = -1; lade(); });
const schiebe = (m,dm) => { const [j,mm] = m.split("-").map(Number);
  const d = new Date(j, mm-1+dm, 1); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0"); };

document.addEventListener("keydown", ev => {
  if (ev.target.tagName === "INPUT" || ev.target.tagName === "SELECT"){
    if (ev.key === "Enter"){ ev.preventDefault(); korrektur(); }
    return;
  }
  if (ev.key === "j" && akt < belege.length - 1) waehle(akt + 1);
  if (ev.key === "k" && akt > 0) waehle(akt - 1);
  if (ev.key === "Enter" && akt >= 0) korrektur();
});

(async () => {
  try{
    const r = await fetch("/api/ich", {credentials:"same-origin"});
    if (r.ok){ $("#app").hidden = false; lade(); }
    else $("#login").hidden = false;
  }catch{ $("#login").hidden = false; }
})();
</script>
</body>
</html>
